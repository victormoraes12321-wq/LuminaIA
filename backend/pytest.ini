[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    unit: testes unitarios sem integracoes externas
    integration: testes de integracao local
    database: requer PostgreSQL descartavel
    security: controles de seguranca
    multitenant: isolamento entre tenants
    ai_mock: provedor de IA simulado
    oracle_mock: Oracle simulado
    baseline: linha de base deterministica
    known_gap: defeito conhecido com xfail estrito
    slow: teste local de maior duracao
    no_database: nao abre conexao; usado para testar o proprio guard
