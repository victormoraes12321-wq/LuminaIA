services:
  lumina-test-postgres:
    image: postgres:16-alpine
    container_name: luminaai-test-postgres
    environment:
      POSTGRES_DB: luminaai_test
      POSTGRES_USER: lumina_test
      POSTGRES_PASSWORD: lumina_test
    ports:
      - "127.0.0.1:${LUMINA_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_test -d luminaai_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - luminaai-test-network

networks:
  luminaai-test-network:
    name: luminaai-test-network
    driver: bridge
